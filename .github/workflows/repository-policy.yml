name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate governance structure
        run: |
          # LumioAgentSpec lumio--v1.1.0 (b0fa9ca); keep in sync with the installed plugin version
          git clone --quiet --depth 1 --branch lumio--v1.1.0 https://github.com/LumioGames/LumioAgentSpec.git /tmp/lumioagentspec
          node /tmp/lumioagentspec/plugin/tools/spec-lint.mjs .
      - name: Validate source tables
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python tools/lumio_config.py validate
          python tools/lumio_config.py format --check
          python tools/lumio_config.py export --out build/export
      - name: Check repository text
        run: git diff --check

  editor:
    name: Editor lint, test, and reproducible build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check Univer deps
        run: node scripts/check-deps.mjs
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Reproducible editor_static
        working-directory: .
        run: git diff --exit-code -- src/lumio_config/editor_static

  editor-e2e:
    name: Editor Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build static host
        run: pnpm build
      - name: E2E
        env:
          PYTHON: python
        run: pnpm e2e
